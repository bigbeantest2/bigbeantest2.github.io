<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CloudMoon">
    <meta name="theme-color" content="#0a0e27">
    <title>CloudMoon - Play Games Instantly</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%232a5dda'/><path d='M50 20 Q70 30 70 50 Q70 70 50 80 Q30 70 30 50 Q30 30 50 20' fill='%23fff' opacity='0.3'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .auth-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1430 100%);
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border-radius: 12px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 20px rgba(42, 93, 218, 0.3);
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #a0a0a0;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 8px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #a0a0a0;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: #2a5dda;
            color: white;
        }

        .auth-form-group {
            margin-bottom: 16px;
        }

        .auth-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #c0c0c0;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            border-color: #2a5dda;
            background: rgba(42, 93, 218, 0.1);
            box-shadow: 0 0 0 3px rgba(42, 93, 218, 0.1);
        }

        .auth-input::placeholder {
            color: #707070;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(42, 93, 218, 0.3);
        }

        .auth-button:active {
            transform: translateY(0);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-divider-text {
            font-size: 12px;
            color: #707070;
        }

        .google-button {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .google-icon {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #1a73e8;
            font-weight: bold;
        }

        .game-grid {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            align-content: start;
        }

        .game-card {
            background: rgba(30, 35, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: rgba(42, 93, 218, 0.5);
            background: rgba(42, 93, 218, 0.1);
            box-shadow: 0 15px 40px rgba(42, 93, 218, 0.2);
        }

        .game-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 12px;
        }

        .game-name {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
            color: #e0e0e0;
            padding: 0 8px;
        }

        .game-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 12px;
        }

        .game-card:hover .game-overlay {
            opacity: 1;
        }

        .play-button {
            padding: 8px 16px;
            background: #2a5dda;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-button:hover {
            background: #1e3a9a;
            transform: scale(1.05);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: rgba(10, 14, 39, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-button:hover {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 100, 100, 0.4);
            color: #ff6464;
        }

        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .auth-box {
                max-width: 100%;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .error-message {
            color: #ff6464;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        const app = document.getElementById('app');
        const STORAGE_KEY = 'cloudmoon_user';
        const GAMES_API = '/data/game_list.json';

        let currentUser = null;
        let gamesList = [];

        async function loadGames() {
            try {
                const response = await fetch(GAMES_API);
                gamesList = await response.json();
            } catch (error) {
                console.error('Failed to load games:', error);
            }
        }

        function getGameName(packageId) {
            const names = {
                'com.miHoYo.GenshinImpact': 'Genshin Impact',
                'com.papegames.lysk.en': 'Lies of P',
                'com.kurogame.wutheringwaves.global': 'Wuthering Waves',
                'com.roblox.client': 'Roblox',
                'com.epicgames.fortnite': 'Fortnite',
                'com.supercell.clashroyale': 'Clash Royale',
                'com.HoYoverse.hkrpgoversea': 'Honkai Star Rail',
                'com.cygames.umamusume': 'Umamusume',
                'com.HoYoverse.Nap': 'Zenless Zone Zero',
                'com.mobile.legends': 'Mobile Legends',
                'com.supercell.brawlstars': 'Brawl Stars',
                'com.tencent.ig': 'PUBG Mobile',
                'com.king.candycrushsaga': 'Candy Crush',
                'com.roblox.client.vnggames': 'Roblox VNG',
                'com.infoldgames.infinitynikkien': 'Infinity Nikki',
                'com.nexon.bluearchive': 'Blue Archive',
                'com.YoStarEN.Arknights': 'Arknights',
                'com.netease.harrypotter.na': 'Harry Potter Wizards',
                'sea.com.iwplay.p5x': 'Persona 5X',
                'com.kurogame.gplay.punishing.grayraven.en': 'Punishing Gray Raven',
                'com.proximabeta.nikke': 'NIKKE',
            };
            return names[packageId] || packageId.split('.').pop();
        }

        function getGameEmoji(packageId) {
            const emojis = {
                'com.miHoYo.GenshinImpact': '🌟',
                'com.papegames.lysk.en': '🎭',
                'com.kurogame.wutheringwaves.global': '🌊',
                'com.roblox.client': '🎮',
                'com.epicgames.fortnite': '🎯',
                'com.supercell.clashroyale': '⚔️',
                'com.HoYoverse.hkrpgoversea': '✨',
                'com.cygames.umamusume': '🐎',
                'com.HoYoverse.Nap': '🚀',
                'com.mobile.legends': '🗡️',
                'com.supercell.brawlstars': '⭐',
                'com.tencent.ig': '🔫',
                'com.king.candycrushsaga': '🍬',
                'com.infoldgames.infinitynikkien': '👗',
                'com.nexon.bluearchive': '👧',
                'com.YoStarEN.Arknights': '🎪',
                'com.netease.harrypotter.na': '🪄',
                'sea.com.iwplay.p5x': '🎵',
                'com.kurogame.gplay.punishing.grayraven.en': '⚡',
                'com.proximabeta.nikke': '🤖',
            };
            return emojis[packageId] || '🎮';
        }

        function saveUser(user) {
            currentUser = user;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
        }

        function getUser() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : null;
        }

        function logout() {
            localStorage.removeItem(STORAGE_KEY);
            currentUser = null;
            renderApp();
        }

        function handleEmailLogin(email, password) {
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            const user = {
                id: Math.random().toString(36).substr(2, 9),
                email: email,
                name: email.split('@')[0],
                loginMethod: 'email'
            };
            saveUser(user);
            renderApp();
        }

        function handleGoogleLogin() {
            const user = {
                id: Math.random().toString(36).substr(2, 9),
                email: 'user@gmail.com',
                name: 'Google User',
                loginMethod: 'google'
            };
            saveUser(user);
            renderApp();
        }

        function showError(message) {
            const errorEl = document.querySelector('.error-message');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
                setTimeout(() => {
                    errorEl.classList.add('hidden');
                }, 3000);
            }
        }

        function renderLoginScreen() {
            app.innerHTML = `
                <div class="auth-container">
                    <div class="auth-box">
                        <div class="auth-logo">🌙</div>
                        <div class="auth-title">CloudMoon</div>
                        <div class="auth-subtitle">Play Games Instantly</div>
                        
                        <div class="auth-tabs">
                            <button class="auth-tab active" data-tab="login">Login</button>
                            <button class="auth-tab" data-tab="signup">Sign Up</button>
                        </div>

                        <div id="login-form">
                            <div class="auth-form-group">
                                <label class="auth-label">Email</label>
                                <input type="email" class="auth-input" id="email-input" placeholder="you@example.com">
                            </div>
                            <div class="auth-form-group">
                                <label class="auth-label">Password</label>
                                <input type="password" class="auth-input" id="password-input" placeholder="••••••••">
                            </div>
                            <button class="auth-button" id="login-btn">Login</button>
                        </div>

                        <div class="auth-divider">
                            <span class="auth-divider-text">or</span>
                        </div>

                        <button class="google-button" id="google-btn">
                            <div class="google-icon">G</div>
                            Login with Google
                        </button>

                        <div class="error-message hidden"></div>
                    </div>
                </div>
            `;

            document.getElementById('login-btn').addEventListener('click', () => {
                const email = document.getElementById('email-input').value;
                const password = document.getElementById('password-input').value;
                handleEmailLogin(email, password);
            });

            document.getElementById('google-btn').addEventListener('click', handleGoogleLogin);

            document.getElementById('email-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const email = document.getElementById('email-input').value;
                    const password = document.getElementById('password-input').value;
                    handleEmailLogin(email, password);
                }
            });

            document.getElementById('password-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const email = document.getElementById('email-input').value;
                    const password = document.getElementById('password-input').value;
                    handleEmailLogin(email, password);
                }
            });

            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                });
            });
        }

        function renderGameGrid() {
            app.innerHTML = `
                <div class="main-content">
                    <div class="header">
                        <div class="header-left">
                            <div class="logo">
                                <div class="logo-icon">🌙</div>
                                CloudMoon
                            </div>
                        </div>
                        <div class="header-right">
                            <div class="user-info">
                                <div class="user-avatar">${currentUser.name.charAt(0).toUpperCase()}</div>
                                <span>${currentUser.name}</span>
                            </div>
                            <button class="logout-button" id="logout-btn">Logout</button>
                        </div>
                    </div>
                    <div class="game-grid" id="game-grid"></div>
                </div>
            `;

            const grid = document.getElementById('game-grid');
            gamesList.forEach(packageId => {
                const gameName = getGameName(packageId);
                const emoji = getGameEmoji(packageId);
                
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-icon">${emoji}</div>
                    <div class="game-name">${gameName}</div>
                    <div class="game-overlay">
                        <button class="play-button">Play Now</button>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    window.location.href = `/game/${packageId}/`;
                });
                
                grid.appendChild(card);
            });

            document.getElementById('logout-btn').addEventListener('click', logout);
        }

        function renderApp() {
            const user = getUser();
            if (user) {
                currentUser = user;
                renderGameGrid();
            } else {
                renderLoginScreen();
            }
        }

        loadGames().then(() => {
            renderApp();
        });
    </script>
</body>
</html>
