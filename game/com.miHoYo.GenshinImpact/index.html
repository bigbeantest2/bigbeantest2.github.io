<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CloudMoon">
    <meta name="theme-color" content="#0a0e27">
    <title>Genshin Impact - CloudMoon</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%232a5dda'/><path d='M50 20 Q70 30 70 50 Q70 70 50 80 Q30 70 30 50 Q30 30 50 20' fill='%23fff' opacity='0.3'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
        }

        #app {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 16px 20px;
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .game-info-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .game-hero {
            width: 100%;
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: white;
            box-shadow: 0 20px 60px rgba(42, 93, 218, 0.3);
        }

        .game-details {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
        }

        .game-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta-badge {
            padding: 8px 12px;
            background: rgba(42, 93, 218, 0.15);
            border: 1px solid rgba(42, 93, 218, 0.3);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #2a5dda;
        }

        .game-description {
            font-size: 14px;
            line-height: 1.6;
            color: #b0b0b0;
        }

        .game-features {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background: rgba(42, 93, 218, 0.05);
            border-radius: 8px;
            border-left: 2px solid #2a5dda;
        }

        .feature-icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .feature-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .play-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(30, 35, 50, 0.5);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .play-title {
            font-size: 18px;
            font-weight: 600;
        }

        .play-status {
            padding: 12px;
            background: rgba(42, 150, 118, 0.1);
            border: 1px solid rgba(42, 150, 118, 0.3);
            border-radius: 8px;
            color: #42d69f;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        .play-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2a5dda 0%, #1e3a9a 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(42, 93, 218, 0.3);
        }

        .play-button:active {
            transform: translateY(0);
        }

        .screenshots {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .screenshots-title {
            font-size: 18px;
            font-weight: 600;
        }

        .screenshot-carousel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .screenshot-item {
            aspect-ratio: 9/16;
            background: rgba(42, 93, 218, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #707070;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .screenshot-item:hover {
            border-color: rgba(42, 93, 218, 0.5);
            background: rgba(42, 93, 218, 0.15);
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 24px;
            }

            .game-hero {
                max-width: 400px;
                margin: 0 auto;
            }
        }

        @media (max-width: 640px) {
            .header {
                padding: 12px 16px;
            }

            .main-content {
                gap: 20px;
                padding: 16px;
            }

            .game-title {
                font-size: 24px;
            }

            .play-section {
                padding: 16px;
            }

            .game-hero {
                aspect-ratio: 3/4;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const gameData = {
            'com.miHoYo.GenshinImpact': {
                title: 'Genshin Impact',
                emoji: '🌟',
                category: 'Action RPG',
                description: 'Explore the vast world of Teyvat in this stunning open-world action RPG. Experience elemental combat, solve puzzles, and uncover secrets in a hand-painted anime world.',
                features: [
                    '📱 Play instantly on any device',
                    '⚡ Zero lag, zero download needed',
                    '🎮 Full gameplay without 30 min limit',
                    '🌍 Available worldwide'
                ]
            }
        };

        const currentGame = 'com.miHoYo.GenshinImpact';
        const game = gameData[currentGame];

        document.getElementById('app').innerHTML = `
            <div class="header">
                <a href="/" class="back-button">← Back to Games</a>
                <div class="logo">
                    <div class="logo-icon">🌙</div>
                    CloudMoon
                </div>
            </div>

            <div class="main-content">
                <div class="game-info-section">
                    <div class="game-hero">${game.emoji}</div>
                    <div class="game-details">
                        <h1 class="game-title">${game.title}</h1>
                        <div class="game-meta">
                            <div class="meta-badge">${game.category}</div>
                            <div class="meta-badge">✨ Free to Play</div>
                        </div>
                        <p class="game-description">${game.description}</p>
                        <div class="game-features">
                            ${game.features.map(f => `<div class="feature-item"><span class="feature-icon">${f.charAt(0)}</span><span class="feature-text">${f.slice(2)}</span></div>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="play-section">
                    <div class="play-title">Ready to Play?</div>
                    <div class="play-status">✓ Ready to Launch</div>
                    <button class="play-button" onclick="alert('Launching game...')">Play Now</button>
                    <div class="screenshots">
                        <div class="screenshots-title">Screenshots</div>
                        <div class="screenshot-carousel">
                            <div class="screenshot-item">Screenshot 1</div>
                            <div class="screenshot-item">Screenshot 2</div>
                            <div class="screenshot-item">Screenshot 3</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
